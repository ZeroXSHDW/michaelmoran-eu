<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1e4f"/>
      <stop offset="100%" stop-color="#1a2a5a"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafafa"/>
  
  <!-- Main content -->
  <g filter="url(#subtle-shadow)" transform="translate(120, 120)">
    <!-- Name -->
    <text x="0" y="0" font-family="Fraunces, serif" font-size="64" font-weight="800" fill="#1a1a1a">
      Michael Moran
    </text>
    <!-- Title -->
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#6b7280">
      Cyber Security Professional
    </text>
  </g>
  
  <!-- Horizontal rule -->
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Tagline -->
  <text x="120" y="430" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6b7280">
    Trusted security asset where failure is not an option
  </text>
  
  <!-- Footer -->
  <text x="120" y="570" font-family="JetBrains Mono, monospace" font-size="16" fill="#6b7280">
    michaelmoran.eu
  </text>
</svg>